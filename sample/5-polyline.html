<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Polyline</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<style>
		#map {
			width: 100%;
			height: 600px;
		}
	</style>
</head>

<body>
	<div id="map"></div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script>
		// Inisialisasi peta
		var map = L.map("map").setView([-6.1753924, 106.8271528], 13);

		// Tile Layer Base Map
		var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
			attribution:
				'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
		});

		// Menambahkan basemap ke dalam peta
		basemap.addTo(map);

		// Polyline
		var vertexPolyline = [
			[-6.1995106, 106.8761802],
			[-6.1753924, 106.8271528],
			[-6.2184607, 106.8023014],
		];
		var polyline = L.polyline(vertexPolyline, {
			color: "red", // warna garis
			weight: 3, // ketebalan garis
			opacity: 1, // opacity garis
		});

		// Menambahkan polyline ke dalam peta
		polyline.addTo(map);

		// Popup
		polyline.bindPopup("<b>Hallo</b><br>Ini adalah popup polyline");
		polyline.openPopup();

		// Tooltip
		polyline.bindTooltip("Ini adalah tooltip polyline");
		polyline.openTooltip();
	</script>
</body>

</html>
